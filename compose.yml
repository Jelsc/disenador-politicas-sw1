version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: tuapp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      - APP_ENV=${APP_ENV}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
      - CERTBOT_CERT_NAME=${CERTBOT_CERT_NAME}
    depends_on:
      - frontend
      - backend
      - ai-service
    restart: unless-stopped
    command: /bin/sh -c "if [ \"$$APP_ENV\" = \"prod\" ]; then if [ -f /etc/letsencrypt/live/$$CERTBOT_CERT_NAME/fullchain.pem ] && [ -f /etc/letsencrypt/live/$$CERTBOT_CERT_NAME/privkey.pem ]; then envsubst '$$FRONTEND_DOMAIN $$API_DOMAIN $$CERTBOT_CERT_NAME' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf; else envsubst '$$FRONTEND_DOMAIN $$API_DOMAIN' < /etc/nginx/templates/default.prod-bootstrap.conf.template > /etc/nginx/conf.d/default.conf; fi; else envsubst '$$API_DOMAIN' < /etc/nginx/templates/default.local.conf.template > /etc/nginx/conf.d/default.conf; fi && exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    container_name: tuapp-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

  mongodb:
    image: mongo:latest
    container_name: tuapp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:alpine
    container_name: tuapp-redis
    restart: unless-stopped

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: tuapp-ai-service
    restart: unless-stopped
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-300}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.1}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-1536}
      - OLLAMA_TOP_P=${OLLAMA_TOP_P:-0.9}
      - OLLAMA_REPEAT_PENALTY=${OLLAMA_REPEAT_PENALTY:-1.1}
      - AI_CORE_MODEL_PATH=${AI_CORE_MODEL_PATH:-/app/models/ai-core.keras}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
    depends_on:
      - ollama
    env_file:
      - .env
    volumes:
      - ai_models:/app/models

  ollama:
    image: ollama/ollama:latest
    container_name: tuapp-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuapp-backend
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/tuapp_db
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - FILE_STORAGE_PATH=/app/uploads
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - APP_ONLYOFFICE_ENABLED=${APP_ONLYOFFICE_ENABLED:-true}
      - APP_ONLYOFFICE_DOCUMENT_SERVER_URL=${APP_ONLYOFFICE_DOCUMENT_SERVER_URL:-http://localhost:8082}
      - APP_ONLYOFFICE_INTERNAL_DOCUMENT_SERVER_URL=${APP_ONLYOFFICE_INTERNAL_DOCUMENT_SERVER_URL:-http://onlyoffice}
      - APP_ONLYOFFICE_BACKEND_BASE_URL=${APP_ONLYOFFICE_BACKEND_BASE_URL:-http://backend:8080}
      - APP_ONLYOFFICE_SHARED_SECRET=${APP_ONLYOFFICE_SHARED_SECRET:-onlyoffice-local-secret}
      - APP_FRONTEND_BASE_URL=${APP_FRONTEND_BASE_URL:-http://localhost}
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tuapp-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - API_URL=${API_URL}
      - AI_URL=${AI_URL}
      - WS_URL=${WS_URL}
    # Reemplazamos el env.template.js al vuelo antes de iniciar angular
    command: >
      /bin/sh -c " apk add --no-cache gettext &&  mkdir -p /app/public/assets && envsubst < /app/public/assets/env.template.js > /app/public/assets/env.js && npx ng serve --host 0.0.0.0 --poll 2000"

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: tuapp-onlyoffice
    shm_size: 1g
    ports:
      - "8082:80"
    environment:
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - JWT_ENABLED=true
      - JWT_SECRET=${APP_ONLYOFFICE_SHARED_SECRET:-onlyoffice-local-secret}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  certbot_data:
  certbot_www:
  ollama_data:
  ai_models:
