spring.application.name=backend
server.port=8080
spring.profiles.active=test

spring.data.mongodb.uri=mongodb://localhost:27017/tuapp_dev
spring.data.mongodb.auto-index-creation=false

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=60000ms

app.jwt.secret=your-secret-key-must-be-very-long-and-secure-at-least-256-bits-for-hs256-tuapp-2026
app.jwt.expiration=86400000

app.storage.s3.bucket=tuapp-files
app.storage.s3.region=us-east-1
app.storage.s3.endpoint=
app.storage.s3.access-key=
app.storage.s3.secret-key=
app.storage.s3.force-path-style=true

app.policy-lock.ttl=PT5M

logging.level.root=INFO
logging.level.com.tuapp=DEBUG
